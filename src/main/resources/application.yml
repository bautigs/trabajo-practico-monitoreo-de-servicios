spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    rest:
      base-path: /api

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

output:
  ansi:
    enabled: always

logging:
  level:
    org.flywaydb: DEBUG

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
    realm: monitoreo-servicios
    client-id: ${KEYCLOAK_BACKEND_CLIENT_ID:monitoreo-backend}
    client-secret: ${KEYCLOAK_BACKEND_SECRET}
    username: ${KEYCLOAK_BACKEND_USERNAME:svc-backend}
    password: ${KEYCLOAK_BACKEND_PASSWORD}
